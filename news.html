<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UBC IT News</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-weight: 300;
    height: 100vh;
    position: relative;
  }

  /* HERO IMAGE — left ~60% */
  .hero {
    position: absolute;
    inset: 0;
    width: 60%;
    background: #161b22;
    background-size: cover;
    background-position: center;
    transition: background-image 0.6s ease;
  }
  .hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, transparent 60%, rgba(13, 17, 23, 0.85) 100%);
  }

  /* CARD — right side */
  .card {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 42%;
    padding: 6vh 4vw 4vh 4vw;
    display: flex;
    flex-direction: column;
    background: rgba(13, 17, 23, 0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .type-tag {
    font-size: 0.85vw;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #58a6ff;
    margin-bottom: 1vh;
  }

  .date {
    font-size: 0.95vw;
    color: #8b949e;
    margin-bottom: 2.5vh;
    letter-spacing: 0.05em;
  }

  .title {
    font-size: 2.6vw;
    font-weight: 600;
    line-height: 1.15;
    letter-spacing: -0.02em;
    margin-bottom: 3vh;
  }

  .summary {
    font-size: 1.5vw;
    line-height: 1.55;
    color: #c9d1d9;
    margin-bottom: 3vh;
    flex: 1;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 8;
    -webkit-box-orient: vertical;
  }

  /* QR area */
  .qr-row {
    display: flex;
    align-items: center;
    gap: 1.4vw;
    padding-top: 2.5vh;
    border-top: 1px solid #21262d;
  }
  .qr {
    width: 7vw;
    height: 7vw;
    background: #e6edf3;
    padding: 0.4vw;
    border-radius: 0.3vw;
    flex-shrink: 0;
  }
  .qr svg { width: 100%; height: 100%; display: block; }
  .qr-label {
    font-size: 0.85vw;
    color: #8b949e;
    letter-spacing: 0.05em;
    line-height: 1.5;
  }
  .qr-label strong {
    display: block;
    color: #e6edf3;
    font-weight: 500;
    font-size: 0.95vw;
    margin-bottom: 0.3vh;
  }

  /* HEADER strip on top of hero */
  .header {
    position: absolute;
    top: 0;
    left: 0;
    width: 60%;
    padding: 4vh 4vw;
    z-index: 10;
  }
  .header .brand {
    font-size: 0.85vw;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #c9d1d9;
    text-shadow: 0 0.1vw 0.3vw rgba(0,0,0,0.5);
  }
  .counter {
    position: absolute;
    bottom: 3vh;
    left: 4vw;
    font-size: 0.75vw;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(230, 237, 243, 0.6);
    text-shadow: 0 0.1vw 0.3vw rgba(0,0,0,0.6);
    font-variant-numeric: tabular-nums;
  }

  .splash {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #484f58;
    font-size: 1.5vw;
    background: #0d1117;
    z-index: 100;
  }
  .splash.hidden { display: none; }
</style>
</head>
<body>

<div class="hero" id="hero"></div>

<div class="header">
  <div class="brand">UBC IT · News &amp; Updates</div>
</div>

<div class="counter" id="counter"></div>

<div class="card" id="card"></div>

<div class="splash" id="splash">Loading news…</div>

<script>
const DATA_URL  = 'news.json';
const RELOAD_MS = 6 * 60 * 60 * 1000;   // re-read JSON every 6h
const ROTATE_MS = 15 * 1000;            // 15 sec per story

let items = [];
let idx   = 0;

async function loadData() {
  try {
    const res  = await fetch(DATA_URL + '?t=' + Date.now());
    const data = await res.json();
    items = data.items || [];
    idx   = idx % Math.max(items.length, 1);
    if (items.length === 0) {
      showSplash('No recent IT news.');
    } else {
      hideSplash();
      render();
    }
  } catch (e) {
    console.error('News load failed:', e);
    showSplash('Unable to load news.');
  }
}

function showSplash(msg) {
  const s = document.getElementById('splash');
  s.textContent = msg;
  s.classList.remove('hidden');
}
function hideSplash() {
  document.getElementById('splash').classList.add('hidden');
}

function render() {
  if (items.length === 0) return;
  const item = items[idx];

  // Hero image
  document.getElementById('hero').style.backgroundImage = `url('${item.image}')`;

  // Card
  document.getElementById('card').innerHTML = `
    <div class="type-tag">News</div>
    <div class="date">${formatDate(item.pub_iso)}</div>
    <div class="title">${escapeHtml(item.title)}</div>
    <div class="summary">${escapeHtml(item.summary || '')}</div>
    <div class="qr-row">
      <div class="qr" id="qr"></div>
      <div class="qr-label">
        <strong>Read more</strong>
        Scan to view the full article
      </div>
    </div>
  `;

  renderQR(item.link);

  document.getElementById('counter').textContent = `${idx + 1} of ${items.length}`;
}

function renderQR(url) {
  const qr = qrcode(0, 'M');
  qr.addData(url);
  qr.make();
  document.getElementById('qr').innerHTML =
    qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
}

function formatDate(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleDateString('en-CA', {
    weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
  });
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

function rotate() {
  if (items.length < 2) return;
  idx = (idx + 1) % items.length;
  render();
}

loadData();
setInterval(rotate, ROTATE_MS);
setInterval(loadData, RELOAD_MS);
</script>
</body>
</html>

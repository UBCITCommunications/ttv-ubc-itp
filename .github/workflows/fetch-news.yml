name: Fetch UBC IT News

on:
  schedule:
    - cron: '0 13 * * *'   # daily at 06:00 PT
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fetch_news.py'
      - '.github/workflows/fetch-news.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Fetch and parse news
        run: python fetch_news.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "Update IT news $(date -u +%FT%TZ)"
          git push
